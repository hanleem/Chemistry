<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Builder — 명지대 화학나노학전공</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@300;400;500;600&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1c2b3a;--gold:#c4a45a;--bg:#e8e2d9;--border:#d4c9b0;--text:#1a1a1a;--muted:#7a6e5a;--accent:#f5f0e8}

body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

/* ── LANG SCREEN ── */
#lang-screen{
  position:fixed;inset:0;
  background:linear-gradient(145deg,#0e1820 0%,#1c2b3a 45%,#253d52 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;z-index:999
}
.ls-logo{text-align:center}
.ls-logo h1{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:#fff;letter-spacing:.5px}
.ls-logo h1 span{color:var(--gold)}
.ls-logo p{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(196,164,90,.5);margin-top:8px}
.ls-back{position:absolute;top:20px;left:20px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.45);font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:4px;transition:all .2s;font-family:'Inter',sans-serif}
.ls-back:hover{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.ls-cards{display:flex;gap:24px}
.ls-card{
  width:230px;background:rgba(255,255,255,.04);
  border:1px solid rgba(196,164,90,.2);border-radius:10px;
  padding:30px 24px 28px;cursor:pointer;text-align:center;
  transition:all .22s;
}
.ls-card:hover{background:rgba(196,164,90,.08);border-color:var(--gold);transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,.35)}
.ls-card-flag{font-size:38px;margin-bottom:14px}
.ls-card-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:#fff;margin-bottom:6px}
.ls-card-sec{font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.ls-card-desc{font-size:11px;color:rgba(232,223,200,.55);line-height:1.75;margin-bottom:20px}
.ls-card-btn{display:inline-block;padding:8px 22px;background:var(--gold);color:var(--navy);border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.4px}

/* ── APP ── */
#app{display:none;flex-direction:column;height:100vh}

.app-header{
  background:var(--navy);color:#e8dfc8;
  padding:0 22px;height:50px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.25)
}
.app-logo{font-family:'Playfair Display',serif;font-size:14.5px;letter-spacing:.4px}
.app-logo span{color:var(--gold)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.lang-badge{background:rgba(196,164,90,.18);color:var(--gold);border:1px solid rgba(196,164,90,.3);border-radius:2px;padding:3px 8px;font-size:9.5px;font-weight:700;letter-spacing:1px}
.hbtn{padding:5px 14px;border-radius:3px;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;cursor:pointer;border:none;transition:all .15s;letter-spacing:.3px}
.hbtn-ghost{background:transparent;color:rgba(232,223,200,.75);border:1px solid rgba(232,223,200,.22)}
.hbtn-ghost:hover{background:rgba(255,255,255,.08)}
.hbtn-back{background:rgba(255,255,255,.08);color:rgba(232,223,200,.8);border:1px solid rgba(232,223,200,.2)}
.hbtn-back:hover{background:rgba(255,255,255,.15);color:#fff}
.hbtn-gold{background:var(--gold);color:var(--navy);font-weight:700}
.hbtn-gold:hover{background:#d4b56a}

/* ── WORKSPACE ── */
.workspace{display:grid;grid-template-columns:400px 1fr;flex:1;overflow:hidden;min-height:0}

/* ── EDITOR ── */
.editor-panel{background:#fff;border-right:1px solid var(--border);overflow-y:auto}
.editor-panel::-webkit-scrollbar{width:5px}
.editor-panel::-webkit-scrollbar-thumb{background:#e0d8c8;border-radius:3px}

.e-sec{border-bottom:1px solid #f0ece3}
.e-sec-head{padding:12px 20px;background:var(--accent);display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.e-sec-head:hover{background:#ede8dc}
.e-num{width:20px;height:20px;background:var(--navy);color:#e8dfc8;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.e-sec-head h3{font-size:12px;font-weight:600;color:var(--navy);flex:1}
.chv{font-size:9px;color:var(--muted);transition:transform .2s}
.chv.open{transform:rotate(180deg)}
.e-sec-body{padding:16px 20px;display:none}
.e-sec-body.open{display:block}

.fg{margin-bottom:11px}
.fg label{display:block;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:4px}
.fg input,.fg textarea{width:100%;background:#fafafa;border:1px solid #e8e0d0;border-radius:4px;font-family:'Inter',sans-serif;font-size:12px;color:var(--text);padding:7px 10px;outline:none;transition:border-color .15s;resize:vertical;line-height:1.6}
.fg input:focus,.fg textarea:focus{border-color:var(--navy);background:#fff}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:10px;color:#b0a080;font-style:italic;margin-top:4px;line-height:1.5}

.photo-area{border:2px dashed #d0c8b4;border-radius:6px;padding:18px;text-align:center;cursor:pointer;position:relative;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;margin-bottom:12px;transition:border-color .15s}
.photo-area:hover{border-color:var(--navy)}
.photo-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-area .ph-label{font-size:11px;color:var(--muted);pointer-events:none}

.chip-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{padding:3px 8px 3px 10px;background:var(--accent);border:1px solid var(--border);border-radius:2px;font-size:11px;color:#4a4030;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:4px}
.chip.off{opacity:.35;text-decoration:line-through}
.chip:hover{background:var(--navy);color:#e8dfc8;border-color:var(--navy)}
.chip-x{font-size:14px;line-height:1;opacity:.6}
.btn-chip-add{padding:3px 10px;background:transparent;border:1px dashed #c4b89a;border-radius:2px;font-size:11px;color:#b0a48a;cursor:pointer;font-family:'Inter',sans-serif;transition:all .12s}
.btn-chip-add:hover{border-color:var(--navy);color:var(--navy)}

.skill-entry{margin-bottom:10px}
.skill-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.skill-head input{flex:1;background:#fafafa;border:1px solid #e8e0d0;border-radius:4px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--navy);padding:6px 10px;outline:none}
.skill-head input:focus{border-color:var(--navy);background:#fff}
.btn-rm{background:transparent;border:1px solid #e0d8c8;border-radius:3px;color:#c0a8a8;font-size:15px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .12s;line-height:1}
.btn-rm:hover{background:#fee;border-color:#e08080;color:#c05050}
.btn-add-row{width:100%;padding:7px;background:transparent;border:1px dashed #c4b89a;border-radius:4px;font-size:11.5px;color:#b0a48a;cursor:pointer;font-family:'Inter',sans-serif;margin-top:4px;transition:all .12s}
.btn-add-row:hover{border-color:var(--navy);color:var(--navy)}

.goal-entry{display:grid;grid-template-columns:26px 1fr 26px;gap:8px;align-items:start;margin-bottom:8px}
.goal-badge{width:26px;height:26px;background:var(--navy);color:#e8dfc8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:4px;flex-shrink:0}

/* ── PREVIEW ── */
.preview-panel{overflow-y:auto;background:#dad4cb;padding:26px 18px;display:flex;flex-direction:column;align-items:center}
.preview-panel::-webkit-scrollbar{width:5px}
.preview-panel::-webkit-scrollbar-thumb{background:#bbb5a8;border-radius:3px}

/* ── CV DOC ── */
.cv-doc{width:794px;min-height:1122px;background:#fff;box-shadow:0 4px 32px rgba(0,0,0,.2);font-family:'Source Serif 4',Georgia,serif;color:#1a1a1a}

.cv-hdr{background:var(--navy);padding:24px 36px;display:grid;grid-template-columns:1fr 86px;gap:16px;align-items:end}
.cv-prog{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:7px;min-height:11px}
.cv-name{font-family:'Playfair Display',serif;font-size:25px;font-weight:700;color:#fff;margin-bottom:11px;min-height:30px}
.cv-info-row{display:flex;flex-wrap:wrap;gap:4px 16px}
.cv-pill{font-size:9.5px;color:#b0a898;display:flex;align-items:center;gap:4px}
.cv-pill-lbl{color:#607080;font-size:8px;text-transform:uppercase;letter-spacing:1px}
.cv-photo{width:86px;height:106px;border:1.5px solid rgba(255,255,255,.15);border-radius:2px;object-fit:cover;display:none}
.cv-photo-ph{width:86px;height:106px;border:1.5px dashed rgba(255,255,255,.15);border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.2);font-size:8px;letter-spacing:1px;text-align:center;gap:5px}
.cv-gold-bar{height:3px;background:linear-gradient(to right,var(--gold),#e8c878,var(--gold))}
.cv-main{display:grid;grid-template-columns:186px 1fr;min-height:calc(1122px - 164px)}

.cv-sb{background:#f7f4ee;padding:22px 16px;border-right:1px solid #eae4d8}
.cv-sb-sec{margin-bottom:18px}
.cv-sb-title{font-family:'Playfair Display',serif;font-size:9.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;padding-bottom:4px;border-bottom:1.5px solid var(--gold)}
.cv-gpa{font-size:10px;line-height:1.85;color:#3a3530;white-space:pre-line}
.cv-course-item{font-size:9.5px;color:#4a4030;padding:2px 4px 2px 10px;position:relative;line-height:1.55}
.cv-course-item::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}
.cv-skill-item{margin-bottom:7px}
.cv-skill-name{font-size:9.5px;font-weight:700;color:var(--navy);margin-bottom:2px}
.cv-skill-detail{font-size:9px;color:#5a5040;line-height:1.7;white-space:pre-line}

.cv-body{padding:22px 28px}
.cv-sec{margin-bottom:16px}
.cv-sec-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cv-sec-title{font-family:'Playfair Display',serif;font-size:12px;font-weight:700;color:var(--navy);white-space:nowrap}
.cv-sec-rule{flex:1;height:1px;background:linear-gradient(to right,var(--navy),#d4c9b0)}
.cv-sec-num{font-size:8px;color:var(--gold);letter-spacing:1px;font-family:'Inter',sans-serif}
.cv-body-text{font-size:10.5px;line-height:1.9;color:#2a2520;white-space:pre-line;text-align:justify}
.cv-goal-row{display:grid;grid-template-columns:20px 1fr;gap:7px;align-items:start;margin-bottom:5px}
.cv-goal-num{width:20px;height:20px;background:var(--navy);color:#e8dfc8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;margin-top:2px}
.cv-goal-text{font-size:10.5px;line-height:1.75;color:#2a2520;white-space:pre-line}

.cv-footer{background:var(--navy);padding:8px 36px;display:flex;justify-content:space-between;align-items:center}
.cv-footer-l{font-size:8px;color:rgba(232,223,200,.38);letter-spacing:1px;text-transform:uppercase}
.cv-footer-r{font-size:8px;color:rgba(232,223,200,.28)}

@media print{
  body{background:#fff;overflow:visible;height:auto}
  #lang-screen{display:none!important}
  .app-header{display:none}
  .workspace{display:block}
  .editor-panel{display:none}
  .preview-panel{padding:0;background:#fff;align-items:flex-start;display:block;overflow:visible}
  .cv-doc{width:100%;box-shadow:none;min-height:0}
}
</style>
</head>
<body>

<!-- ══ LANGUAGE SELECTION ══ -->
<div id="lang-screen">
  <a class="ls-back" href="/">← 메인 앱으로</a>
  <div class="ls-logo">
    <h1>CV <span>Builder</span></h1>
    <p>명지대 화학나노학전공 — CV 작성 도구</p>
  </div>
  <div class="ls-cards">
    <div class="ls-card" onclick="selectLang('en')">
      <div class="ls-card-flag">🇺🇸</div>
      <div class="ls-card-title">English CV</div>
      <div class="ls-card-sec">5 Sections</div>
      <div class="ls-card-desc">Basic Info · Coursework<br>Personal Statement<br>Technical Skills<br>Motivation for Application</div>
      <div class="ls-card-btn">Start in English →</div>
    </div>
    <div class="ls-card" onclick="selectLang('ko')">
      <div class="ls-card-flag">🇰🇷</div>
      <div class="ls-card-title">한국어 CV</div>
      <div class="ls-card-sec">8개 섹션</div>
      <div class="ls-card-desc">기본 정보 · 수강 과목<br>자기소개 · 기술 역량<br>지원 동기 · 학업 목표<br>협업 역량 · 향후 진로</div>
      <div class="ls-card-btn">한국어로 시작 →</div>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:16px">
      <button class="hbtn hbtn-back" onclick="history.back()">← 메인 앱</button>
      <div class="app-logo">CV <span>Builder</span> · 화학나노학전공</div>
    </div>
    <div class="hdr-actions">
      <span class="lang-badge" id="hdr-lang">EN</span>
      <button class="hbtn hbtn-ghost" id="hdr-change" onclick="changeLang()">Change Language</button>
      <button class="hbtn hbtn-ghost" id="hdr-clear" onclick="clearAll()">Reset</button>
      <button class="hbtn hbtn-gold" id="hdr-pdf" onclick="window.print()">⬇ PDF Save</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="editor-panel" id="editor-panel"></aside>
    <main class="preview-panel">
      <div class="cv-doc" id="cv-doc"></div>
    </main>
  </div>
</div>

<script>
/* ══ CONFIG ══ */
const CFG = {
  en: {
    label:'EN', pdfBtn:'⬇ PDF Save', clearBtn:'Reset', changeLangBtn:'Change Language',
    info:{
      title:'Basic Information',
      lb:{name:'Full Name (EN)',dob:'Date of Birth',univ:'University',year:'Year',major:'Major',dept:'Dept / School',email:'Email',phone:'Phone',gpa:'GPA / Scholarship Record'},

      photoLabel:'Photo Upload (3×4 cm)'
    },

      title:'Coursework',
      foundLabel:'Major Foundational Courses',majorLabel:'Major Courses',
      foundDef:['Chemistry Ⅰ','Chemistry Ⅱ','Physics Ⅰ','Physics Ⅱ','Calculus Ⅰ','Calculus Ⅱ','Chemistry Lab Ⅰ'],

    cv:{

  },
  ko: {
    label:'KO', pdfBtn:'⬇ PDF 저장', clearBtn:'초기화', changeLangBtn:'언어 변경',
    info:{
      title:'기본 정보',
      lb:{name:'성명 (영문)',dob:'생년월일',univ:'대학교',year:'학년',major:'전공',dept:'학과 / 학부',email:'이메일',phone:'연락처',gpa:'학점 / 장학금 내역'},
      ph:{name:'홍길동 (Hong Gildong)',dob:'YYYY.MM.DD',univ:'명지대학교',year:'2학년',major:'화학·나노과학',dept:'에너지융합학부',email:'your@univ.ac.kr',phone:'010-XXXX-XXXX',gpa:'1학년 1학기: 4.43/4.5 (최우수 장학금)\n1학년 2학기: 4.13/4.5\n누적 평점: 4.22/4.5'},
      photoLabel:'사진 업로드 (3×4 cm)'
    },
    coursework:{
      title:'수강 과목',
      foundLabel:'기초 교양 · 전필 과목',majorLabel:'전공 과목',
      foundDef:['일반화학Ⅰ','일반화학Ⅱ','물리학Ⅰ','물리학Ⅱ','미적분학Ⅰ','미적분학Ⅱ','화학실험Ⅰ'],
      majorDef:['유기화학Ⅰ','무기화학Ⅰ','분석화학Ⅰ','물리화학Ⅰ'],
      addBtn:'+ 과목 추가',hint:'※ 클릭 시 취소선(미수강 처리) · × 버튼으로 삭제'

    statement:{
      title:'자기소개 및 연구 방향',
      label:'자기소개서 (영문 작성 권장, 3–4 문단)',
      ph:'[문단 1] 전공 및 목표 소개\n저는 [대학교] [전공]을 전공하는 [학년]으로, [분야] 연구자를 목표로 하고 있습니다.\n\n[문단 2] 관심 분야로 이어진 계기 (구체적 경험 + 깨달음)\n[경험]을 처음 접했을 때, [깨달음]을 얻게 되었습니다...\n\n[문단 3] 학업 태도 · 강점\n이해하지 못한 내용을 절대 그냥 넘어가지 않는 것을 원칙으로 합니다...\n\n[문단 4] 팀워크 / 국제 경험 (선택)\n[활동]을 통해 [역량]을 키웠습니다...',
      hint:'※ 경험 → 깨달음 → 연구 목표 흐름 권장'
    },

let lang = null;
let _id = 0;
const S = {
  name:'',dob:'',univ:'',year:'',major:'',dept:'',email:'',phone:'',gpa:'',
  foundChips:[],majorChips:[],skills:[],

};

/* ══ ENTRY ══ */
function selectLang(l) {
  lang = l;
  const c = CFG[l];
  document.getElementById('lang-screen').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  app.style.flexDirection = 'column';
  app.style.height = '100vh';
  document.getElementById('hdr-lang').textContent = c.label;
  document.getElementById('hdr-change').textContent = c.changeLangBtn;
  document.getElementById('hdr-clear').textContent = c.clearBtn;
  document.getElementById('hdr-pdf').textContent = c.pdfBtn;
  resetState();
  buildEditor();
  buildCVShell();
  initDefaults();
  sync();
}

function changeLang() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('lang-screen').style.display = 'flex';
  lang = null;
}

function resetState() {
  S.name=S.dob=S.univ=S.year=S.major=S.dept=S.email=S.phone=S.gpa=S.ps=S.mot=S.collab=S.career='';
  S.foundChips=[]; S.majorChips=[]; S.skills=[]; S.goals=[]; S.photo=null; _id=0;
}

/* ══ EDITOR ══ */
function buildEditor() {
  const c = CFG[lang];
  const sections = [
    sec(1, c.info.title, true, infoBody()),
    sec(2, c.coursework.title, false, courseworkBody()),
    sec(3, c.statement.title, false, statementBody()),
    sec(4, c.skills.title, false, skillsBody()),
    sec(5, c.motivation.title, false, motivationBody()),
  ];
  if (lang === 'ko') {
    sections.push(
      sec(6, c.goals.title, false, goalsBody()),
      sec(7, c.collab.title, false, collabBody()),
      sec(8, c.career.title, false, careerBody())
    );
  }
  document.getElementById('editor-panel').innerHTML = sections.join('');
}

function sec(n, title, open, body) {
  return `<div class="e-sec">
    <div class="e-sec-head" onclick="toggleSec(this)">
      <div class="e-num">${n}</div><h3>${title}</h3>
      <span class="chv ${open?'open':''}">▲</span>
    </div>
    <div class="e-sec-body ${open?'open':''}">${body}</div>
  </div>`;
}

function fg(label, html) { return `<div class="fg"><label>${label}</label>${html}</div>`; }

function infoBody() {
  const {lb,ph,photoLabel} = CFG[lang].info;
  return `<div class="photo-area">
    <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="#c4b89a" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <span class="ph-label">${photoLabel}<br><small style="opacity:.7">JPG / PNG</small></span>
    <input type="file" accept="image/*" onchange="uploadPhoto(this)">
    <img id="photo-thumb" style="display:none">
  </div>
  <div class="two-col">
    ${fg(lb.name,`<input type="text" id="f-name" placeholder="${ph.name}" oninput="inp('name',this.value)">`)}
    ${fg(lb.dob,`<input type="text" id="f-dob" placeholder="${ph.dob}" oninput="inp('dob',this.value)">`)}
    ${fg(lb.univ,`<input type="text" id="f-univ" placeholder="${ph.univ}" oninput="inp('univ',this.value)">`)}
    ${fg(lb.year,`<input type="text" id="f-year" placeholder="${ph.year}" oninput="inp('year',this.value)">`)}
    ${fg(lb.major,`<input type="text" id="f-major" placeholder="${ph.major}" oninput="inp('major',this.value)">`)}
    ${fg(lb.dept,`<input type="text" id="f-dept" placeholder="${ph.dept}" oninput="inp('dept',this.value)">`)}
    ${fg(lb.email,`<input type="email" id="f-email" placeholder="${ph.email}" oninput="inp('email',this.value)">`)}
    ${fg(lb.phone,`<input type="text" id="f-phone" placeholder="${ph.phone}" oninput="inp('phone',this.value)">`)}
  </div>
  ${fg(lb.gpa,`<textarea id="f-gpa" rows="4" placeholder="${enc(ph.gpa)}" oninput="inp('gpa',this.value)"></textarea>`)}`;
}

function courseworkBody() {
  const c = CFG[lang].coursework;
  return `<div class="fg"><label>${c.foundLabel}</label>
    <div class="chip-wrap" id="found-chips"></div>
    <button class="btn-chip-add" onclick="addChip('found','found')">${c.addBtn}</button>

  <div class="fg" style="margin-top:8px"><label>${c.majorLabel}</label>

function statementBody() {

function skillsBody() {

function motivationBody() {
  const c = CFG[lang].motivation;

  <p class="hint">${c.hint}</p>`;

function goalsBody() {

  <button class="btn-add-row" onclick="addGoalRow()">${CFG.ko.goals.addBtn}</button>`;

function collabBody() {
  const c = CFG.ko.collab;
  return `${fg('',`<textarea id="f-collab" rows="8" placeholder="${enc(c.ph)}" oninput="inp('collab',this.value)"></textarea>`)}
  <p class="hint">${c.hint}</p>`;

function careerBody() {
  return fg('',`<textarea id="f-career" rows="7" placeholder="${enc(CFG.ko.career.ph)}" oninput="inp('career',this.value)"></textarea>`);

function cvSec(num, title, content) {
  return `<div class="cv-sec"><div class="cv-sec-head">
    <div class="cv-sec-title">${title}</div><div class="cv-sec-rule"></div>
    <div class="cv-sec-num">${num}</div></div>${content}</div>`;

/* ══ DEFAULTS ══ */
function initDefaults() {
  const c = CFG[lang];
  c.coursework.foundDef.forEach(n => S.foundChips.push({id:++_id,name:n,on:true}));
  c.coursework.majorDef.forEach(n => S.majorChips.push({id:++_id,name:n,on:true}));
  c.skills.defaults.forEach(s => S.skills.push({id:++_id,name:s.name,detail:s.detail}));
  if (lang==='ko') CFG.ko.goals.defaults.forEach(t => S.goals.push({id:++_id,text:t}));
  renderChips(); renderSkills(); if (lang==='ko') renderGoals();
}

/* ══ SYNC ══ */
function inp(k,v){S[k]=v;sync();}
function setText(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}

function sync() {
  if (!lang) return;
  setText('cv-name', S.name||(lang==='ko'?'이름':'Your Name'));
  setText('cv-univ', S.univ||'—'); setText('cv-year', S.year||'—');
  setText('cv-major', S.major||'—'); setText('cv-email', S.email||'—');
  setText('cv-phone', S.phone||'—'); setText('cv-gpa', S.gpa||'—');
  setText('cv-ps', S.ps||'—'); setText('cv-mot', S.mot||'—');
  if (lang==='ko') {
    setText('cv-collab', S.collab||'—'); setText('cv-career', S.career||'—');
    syncGoals();
  }
  syncCourses('cv-found', S.foundChips); syncCourses('cv-major-c', S.majorChips);
  syncSkills();
}

function syncCourses(id, arr) {
  const el=document.getElementById(id); if(!el)return;
  const a=arr.filter(c=>c.on);
  el.innerHTML=a.length?a.map(c=>`<div class="cv-course-item">${esc(c.name)}</div>`).join(''):'<div style="font-size:9px;color:#ccc">—</div>';
}

function syncSkills() {
  const el=document.getElementById('cv-skills'); if(!el)return;
  el.innerHTML=S.skills.length?S.skills.map(s=>`<div class="cv-skill-item"><div class="cv-skill-name">${esc(s.name)||'—'}</div><div class="cv-skill-detail">${esc(s.detail)}</div></div>`).join(''):'<div style="font-size:9px;color:#ccc">—</div>';
}

function syncGoals() {
  const el=document.getElementById('cv-goals'); if(!el)return;
  el.innerHTML=S.goals.length?S.goals.map((g,i)=>`<div class="cv-goal-row"><div class="cv-goal-num">${i+1}</div><div class="cv-goal-text">${esc(g.text)||'—'}</div></div>`).join(''):'<div style="font-size:10px;color:#ccc">—</div>';
}

/* ══ CHIPS ══ */
function addChip(prefix, type) {
  const name=prompt(lang==='ko'?'과목명 입력:':'Enter course name:');
  if(!name)return;
  const arr=type==='found'?S.foundChips:S.majorChips;
  arr.push({id:++_id,name,on:true});
  renderChips(); sync();
}

function toggleChip(type,id) {
  const arr=type==='found'?S.foundChips:S.majorChips;
  const c=arr.find(x=>x.id===id); if(c)c.on=!c.on;
  renderChips(); sync();
}

function removeChip(type,id) {
  if(type==='found') S.foundChips=S.foundChips.filter(x=>x.id!==id);
  else S.majorChips=S.majorChips.filter(x=>x.id!==id);
  renderChips(); sync();
}

function renderChips() {
  ['found','major'].forEach(t=>{
    const wrap=document.getElementById(`${t}-chips`); if(!wrap)return;
    const arr=t==='found'?S.foundChips:S.majorChips;
    wrap.innerHTML=arr.map(c=>`<div class="chip${c.on?'':' off'}">
      <span onclick="toggleChip('${t}',${c.id})">${esc(c.name)}</span>
      <span class="chip-x" onclick="removeChip('${t}',${c.id})">×</span>
    </div>`).join('');
  });
}

/* ══ SKILLS ══ */
function addSkillRow(){S.skills.push({id:++_id,name:'',detail:''});renderSkills();}

function removeSkill(id){S.skills=S.skills.filter(s=>s.id!==id);renderSkills();sync();}

function updSkill(id,k,v){const s=S.skills.find(x=>x.id===id);if(s){s[k]=v;sync();}}

function renderSkills(){
  const list=document.getElementById('skill-list'); if(!list)return;
  const c=CFG[lang].skills;
  list.innerHTML=S.skills.map(s=>`<div class="skill-entry">
    <div class="skill-head">
      <input type="text" placeholder="${c.namePh}" value="${esc(s.name)}" oninput="updSkill(${s.id},'name',this.value)">
      <button class="btn-rm" onclick="removeSkill(${s.id})">×</button>
    </div>
    <textarea rows="3" placeholder="${enc(c.detailPh)}" oninput="updSkill(${s.id},'detail',this.value)">${esc(s.detail)}</textarea>
  </div>`).join('');
}

/* ══ GOALS (KO) ══ */
function addGoalRow(){S.goals.push({id:++_id,text:''});renderGoals();}

function removeGoal(id){S.goals=S.goals.filter(g=>g.id!==id);renderGoals();syncGoals();}

function updGoal(id,v){const g=S.goals.find(x=>x.id===id);if(g){g.text=v;syncGoals();}}

function renderGoals(){
  const list=document.getElementById('goal-list'); if(!list)return;
  const c=CFG.ko.goals;
  list.innerHTML=S.goals.map((g,i)=>`<div class="goal-entry">
    <div class="goal-badge">${i+1}</div>
    <textarea rows="3" placeholder="${enc(c.ph)}" oninput="updGoal(${g.id},this.value)">${esc(g.text)}</textarea>
    <button class="btn-rm" onclick="removeGoal(${g.id})">×</button>
  </div>`).join('');
}

/* ══ PHOTO ══ */
function uploadPhoto(input){
  if(!input.files?.[0])return;
  const r=new FileReader();
  r.onload=e=>{
    S.photo=e.target.result;
    const t=document.getElementById('photo-thumb');
    const p=document.getElementById('cv-photo');
    const ph=document.getElementById('cv-photo-ph');
    if(t){t.src=S.photo;t.style.display='block';}
    if(p){p.src=S.photo;p.style.display='block';}
    if(ph)ph.style.display='none';
    const lbl=document.querySelector('.photo-area .ph-label');
    if(lbl)lbl.style.display='none';
  };
  r.readAsDataURL(input.files[0]);
}

/* ══ ACCORDION ══ */
function toggleSec(head){
  const body=head.nextElementSibling;
  const ch=head.querySelector('.chv');
  const open=body.classList.contains('open');
  body.classList.toggle('open',!open);
  ch.classList.toggle('open',!open);
}

/* ══ CLEAR ══ */
function clearAll(){
  const msg=lang==='ko'?'모든 입력 내용을 초기화하시겠습니까?':'Reset all content?';
  if(!confirm(msg))return;
  resetState();
  document.querySelectorAll('#editor-panel input[type=text],#editor-panel input[type=email],#editor-panel textarea')
    .forEach(el=>el.value='');
  initDefaults(); sync();
}

/* ══ UTILS ══ */
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function enc(s){return(s||'').replace(/\n/g,'&#10;');}
